name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without a leading v (rehearsal only)
        required: true
        default: 1.0.0
        type: string
      build_number:
        description: Positive integer bundle build number
        required: true
        default: "1"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Sign and notarize
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate source and release metadata
        id: release_metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit is not contained in origin/main" >&2
            exit 1
          }

          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "Tag must use the stable vX.Y.Z form" >&2
              exit 1
            }
            version=${REF_NAME#v}
            build_number=$GITHUB_RUN_NUMBER
          else
            [[ "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "Version must use the stable X.Y.Z form" >&2
              exit 1
            }
            [[ "$INPUT_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
              echo "Build number must be a positive integer" >&2
              exit 1
            }
            version=$INPUT_VERSION
            build_number=$INPUT_BUILD_NUMBER
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Re-run source gates on the release commit
        run: make check

      - name: Import release credentials into temporary files
        id: credentials
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          [[ -n "$CERTIFICATE_P12" && -n "$CERTIFICATE_PASSWORD" && -n "$API_KEY_P8" && -n "$API_KEY_ID" ]]

          keychain="$RUNNER_TEMP/reserve-signing.keychain-db"
          keychain_password=$(uuidgen)
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"

          printf '%s' "$CERTIFICATE_P12" | /usr/bin/base64 -D > "$certificate"
          printf '%s' "$API_KEY_P8" > "$api_key"
          chmod 600 "$certificate" "$api_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          available_identities=$(security find-identity -v -p codesigning "$keychain")
          identity=$(sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            <<< "$available_identities" | sed -n '1p')
          [[ -n "$identity" ]] || {
            echo "No Developer ID Application identity was imported" >&2
            exit 1
          }

          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "api_key=$api_key" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize, and verify
        env:
          RESERVE_SIGN_IDENTITY: ${{ steps.credentials.outputs.identity }}
          RESERVE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_PATH: ${{ steps.credentials.outputs.api_key }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          RESERVE_VERSION: ${{ steps.release_metadata.outputs.version }}
          RESERVE_BUILD_NUMBER: ${{ steps.release_metadata.outputs.build_number }}
          RESERVE_OUTPUT_DIR: ${{ runner.temp }}/reserve-release
        run: ./Scripts/package_app.sh --mode release

      - name: Generate signed Sparkle update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RESERVE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "$SPARKLE_PRIVATE_KEY" ]]
          output_dir="$RUNNER_TEMP/reserve-release"
          tool=.build/artifacts/sparkle/Sparkle/bin/generate_appcast
          [[ -x "$tool" && -f "$output_dir/Reserve.dmg" ]]
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$tool" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v${RESERVE_VERSION}/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/v${RESERVE_VERSION}" \
            "$output_dir"
          xmllint --noout "$output_dir/appcast.xml"
          grep -Fq "Reserve.dmg" "$output_dir/appcast.xml"
          grep -Fq "sparkle:edSignature=" "$output_dir/appcast.xml"

      - name: Remove temporary credentials
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/reserve-signing.keychain-db" 2>/dev/null
          rm -f "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8" "$RUNNER_TEMP/developer-id.p12"

      - name: Upload signed rehearsal or release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Reserve-${{ steps.release_metadata.outputs.version }}
          path: |
            ${{ runner.temp }}/reserve-release/Reserve.dmg
            ${{ runner.temp }}/reserve-release/Reserve.dmg.sha256
            ${{ runner.temp }}/reserve-release/appcast.xml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Reserve-${{ needs.package.outputs.version }}
          path: release-assets

      - name: Publish immutable tag release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_PREAMBLE: |
            ## Updating from Reserve 0.9.1 or earlier

            This is the one update that must be installed manually:

            1. Download **Reserve.dmg** below.
            2. Open it and drag Reserve into **Applications**.
            3. Choose **Replace**, then reopen Reserve.

            After this, Reserve can install future updates for you.
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c Reserve.dmg.sha256
          gh release create "$TAG" Reserve.dmg Reserve.dmg.sha256 appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Reserve ${TAG#v}" \
            --notes "$RELEASE_PREAMBLE" \
            --generate-notes \
            --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
